[api_keys]
# Google Maps / Places API key (required for Google Maps enrichment)
# Get one at: https://console.cloud.google.com/apis/credentials
google_maps_api_key = YOUR_GOOGLE_MAPS_API_KEY

# SerpAPI key for internet search (optional - falls back to free DuckDuckGo)
# Get one at: https://serpapi.com/
serpapi_key = YOUR_SERPAPI_KEY

[files]
# Input CSV with properties to enrich
input_csv = properties.csv

# Output CSV with enriched data
output_csv = properties_enriched.csv

[settings]
# Seconds to wait between requests to be respectful to servers
request_delay = 3

# Seconds to wait between MH Village lookups (extra conservative)
mhvillage_delay = 10

# Max number of properties to process per run (0 = all)
max_properties = 0

# Enable/disable each data source
enable_internet_search = true
enable_google_maps = true
enable_mhvillage = true

[mhvillage]
# MH Village rate limiting and politeness settings
# We access MH Village very conservatively to respect their service
max_requests_per_session = 20
respect_robots_txt = true
user_agent = PropertyResearchBot/1.0 (contact: your-email@example.com)
