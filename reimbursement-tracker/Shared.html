<style>
  :root {
    --bg: #f5f5f4;
    --card: #ffffff;
    --ink: #1c1917;
    --muted: #78716c;
    --accent: #0f766e;
    --accent-ink: #ffffff;
    --danger: #b91c1c;
    --border: #e7e5e4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg); color: var(--ink); line-height: 1.4;
  }
  .wrap { max-width: 760px; margin: 0 auto; padding: 16px; }
  h1 { font-size: 1.4rem; margin: 0 0 4px; }
  h2 { font-size: 1.05rem; margin: 24px 0 8px; color: var(--muted); text-transform: uppercase; letter-spacing: 0.05em; }
  .muted { color: var(--muted); font-size: 0.9rem; }
  .card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 14px; margin-bottom: 12px; }
  .row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
  .row.between { justify-content: space-between; }
  button, .btn {
    appearance: none; border: 1px solid var(--border); background: var(--card);
    padding: 8px 14px; border-radius: 8px; font-size: 0.95rem; cursor: pointer;
  }
  button.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent); }
  button.danger { color: var(--danger); border-color: var(--danger); background: #fff; }
  button:disabled { opacity: 0.5; cursor: not-allowed; }
  input, select, textarea {
    width: 100%; padding: 8px 10px; border: 1px solid var(--border); border-radius: 8px;
    font-size: 1rem; background: white;
  }
  table { width: 100%; border-collapse: collapse; font-size: 0.92rem; }
  th, td { text-align: left; padding: 8px 6px; border-bottom: 1px solid var(--border); }
  th { color: var(--muted); font-weight: 500; }
  .pill { display: inline-block; padding: 2px 8px; border-radius: 999px; font-size: 0.8rem; background: #e7e5e4; }
  .pill.you { background: #dbeafe; color: #1e3a8a; }
  .pill.cw { background: #fef3c7; color: #92400e; }
  .big { font-size: 2rem; font-weight: 600; }
  .stat { display: flex; flex-direction: column; gap: 2px; }
  .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  .running { background: #ecfdf5; border-color: #6ee7b7; }
  .timer { font-variant-numeric: tabular-nums; }
  details summary { cursor: pointer; padding: 6px 0; }
  .toast {
    position: fixed; bottom: 16px; left: 50%; transform: translateX(-50%);
    background: #1c1917; color: white; padding: 10px 16px; border-radius: 8px;
    font-size: 0.9rem; opacity: 0; transition: opacity 0.2s;
  }
  .toast.show { opacity: 1; }
</style>
<script>
  function fmtDate(iso) {
    if (!iso) return '';
    const d = new Date(iso);
    return d.toLocaleDateString([], { month: 'short', day: 'numeric' }) + ' ' +
           d.toLocaleTimeString([], { hour: 'numeric', minute: '2-digit' });
  }
  function fmtMoney(n) {
    return '$' + Number(n || 0).toLocaleString(undefined, { minimumFractionDigits: 2, maximumFractionDigits: 2 });
  }
  function fmtHours(n) { return Number(n || 0).toFixed(2) + ' hrs'; }
  function toast(msg) {
    let el = document.getElementById('toast');
    if (!el) {
      el = document.createElement('div');
      el.id = 'toast'; el.className = 'toast';
      document.body.appendChild(el);
    }
    el.textContent = msg;
    el.classList.add('show');
    clearTimeout(window._toastTimer);
    window._toastTimer = setTimeout(() => el.classList.remove('show'), 1800);
  }
  function call(name, args) {
    return new Promise((resolve, reject) => {
      const runner = google.script.run
        .withSuccessHandler(resolve)
        .withFailureHandler(err => { toast(err.message || 'Error'); reject(err); });
      runner[name].apply(runner, args || []);
    });
  }
</script>
